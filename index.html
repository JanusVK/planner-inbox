<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner Inbox</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/msal.js/2.38.3/msal-browser.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { background: #fff; border-radius: 16px; padding: 2rem; width: 100%; max-width: 420px; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 1.75rem; }
  .logo-icon { width: 32px; height: 32px; background: #0078d4; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 18px; height: 18px; fill: white; }
  .logo h1 { font-size: 17px; font-weight: 600; color: #1a1a1a; }
  .logo span { font-size: 13px; color: #888; font-weight: 400; display: block; margin-top: 1px; }
  label { display: block; font-size: 13px; font-weight: 500; color: #444; margin-bottom: 6px; }
  input[type="text"], textarea, input[type="date"] {
    width: 100%; border: 1px solid #ddd; border-radius: 8px;
    padding: 10px 12px; font-size: 15px; color: #1a1a1a;
    font-family: inherit; outline: none; transition: border-color 0.15s;
    background: #fafafa;
  }
  input[type="text"]:focus, textarea:focus, input[type="date"]:focus { border-color: #0078d4; background: #fff; }
  textarea { resize: none; height: 80px; line-height: 1.5; }
  .field { margin-bottom: 1.1rem; }
  .btn { width: 100%; padding: 12px; background: #0078d4; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: background 0.15s; }
  .btn:hover { background: #006abc; }
  .btn:disabled { background: #99c2e8; cursor: not-allowed; }
  .status { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
  .status.success { background: #e6f4ea; color: #1e7e34; display: block; }
  .status.error { background: #fde8e8; color: #b91c1c; display: block; }
  .status.loading { background: #e8f0fe; color: #1a56db; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 3a1 1 0 011 1v4h4a1 1 0 010 2h-4v4a1 1 0 01-2 0v-4H7a1 1 0 010-2h4V7a1 1 0 011-1z"/></svg>
    </div>
    <div>
      <h1>Planner Inbox</h1>
      <span>Tilføj opgave til indbakken</span>
    </div>
  </div>

  <div class="field">
    <label for="title">Opgavetitel *</label>
    <input type="text" id="title" placeholder="Hvad skal gøres?" autocomplete="off" />
  </div>

  <div class="field">
    <label for="notes">Noter</label>
    <textarea id="notes" placeholder="Yderligere detaljer (valgfrit)"></textarea>
  </div>

  <div class="field">
    <label for="duedate">Forfaldsdato</label>
    <input type="date" id="duedate" />
  </div>

  <button class="btn" id="submit-btn" onclick="submitTask()">Tilføj til indbakken</button>
  <div class="status" id="status"></div>
</div>

<script>
const CLIENT_ID = 'caa0e2e7-c427-49eb-805b-5e89a3471eab';
const TENANT_ID = '464c8dbf-6c10-4fcf-bab6-31d8ff5d8641';
const PLAN_ID   = 'zrt5cAtBGUWnRPCeZqjFupgAFAdw';
const SCOPES    = ['Tasks.ReadWrite', 'Group.Read.All'];

const msalApp = new msal.PublicClientApplication({
  auth: {
    clientId: CLIENT_ID,
    authority: `https://login.microsoftonline.com/${TENANT_ID}`,
    redirectUri: 'https://janusvk.github.io/planner-inbox/'
  },
  cache: { cacheLocation: 'sessionStorage' }
});

async function init() {
  await msalApp.initialize();
}

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

async function getToken() {
  const accounts = msalApp.getAllAccounts();
  if (accounts.length > 0) {
    try {
      const res = await msalApp.acquireTokenSilent({ scopes: SCOPES, account: accounts[0] });
      return res.accessToken;
    } catch {}
  }
  try {
    const res = await msalApp.acquireTokenPopup({ scopes: SCOPES });
    return res.accessToken;
  } catch (e) {
    showStatus('Login annulleret eller blokeret: ' + e.message, 'error');
    return null;
  }
}

async function createTask(token) {
  const title = document.getElementById('title').value.trim();
  const notes = document.getElementById('notes').value.trim();
  const duedate = document.getElementById('duedate').value;

  showStatus('Opretter opgave…', 'loading');
  document.getElementById('submit-btn').disabled = true;

  const body = { title, planId: PLAN_ID };
  if (duedate) body.dueDateTime = new Date(duedate + 'T12:00:00').toISOString();

  try {
    const res = await fetch('https://graph.microsoft.com/v1.0/planner/tasks', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (res.ok && notes) {
      const task = await res.json();
      const etag = task['@odata.etag'] || '';
      await fetch(`https://graph.microsoft.com/v1.0/planner/tasks/${task.id}/details`, {
        method: 'PATCH',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json',
          'If-Match': etag
        },
        body: JSON.stringify({ description: notes })
      });
    }

    if (res.ok) {
      showStatus('✓ Opgave tilføjet til indbakken!', 'success');
      document.getElementById('title').value = '';
      document.getElementById('notes').value = '';
      document.getElementById('duedate').value = '';
    } else {
      const err = await res.json();
      showStatus('Fejl: ' + (err.error?.message || res.status), 'error');
    }
  } catch (e) {
    showStatus('Netværksfejl: ' + e.message, 'error');
  }
  document.getElementById('submit-btn').disabled = false;
}

async function submitTask() {
  const title = document.getElementById('title').value.trim();
  if (!title) { showStatus('Skriv en opgavetitel.', 'error'); return; }
  document.getElementById('submit-btn').disabled = true;
  showStatus('Logger ind…', 'loading');

  const accounts = msalApp.getAllAccounts();
  let token = null;

  if (accounts.length > 0) {
    try {
      const res = await msalApp.acquireTokenSilent({ scopes: SCOPES, account: accounts[0] });
      token = res.accessToken;
    } catch {}
  }

  if (!token) {
    try {
      const res = await msalApp.acquireTokenPopup({ scopes: SCOPES });
      token = res.accessToken;
    } catch (e) {
      showStatus('Login fejlede: ' + e.message, 'error');
      document.getElementById('submit-btn').disabled = false;
      return;
    }
  }

  await createTask(token);
}

init();
</script>
</body>
</html>
